<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Play Creator</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; width: 100%; height: 100%; }
.container { display: flex; flex-direction: column; height: 100vh; width: 100%; }
.toolbar { padding: 12px; border-bottom: 1px solid #ddd; display: flex; gap: 8px; flex-wrap: wrap; background: #f0f0f0; font-size: 14px; align-items: center; }
.toolbar button, .toolbar select { padding: 10px 14px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; min-height: 44px; touch-action: manipulation; }
.toolbar button:hover { background: #f0f0f0; }
.toolbar button.active { background: #4a90e2; color: white; border-color: #4a90e2; }
.mode-buttons { display: flex; gap: 4px; border-right: 1px solid #ddd; padding-right: 12px; }
.divider { width: 1px; background: #ddd; height: 30px; }
@media (max-width: 600px) {
  .toolbar { padding: 8px; gap: 6px; }
  .toolbar button, .toolbar select { padding: 10px 12px; font-size: 13px; min-height: 40px; }
  .mode-buttons { gap: 2px; }
}
.toolbar button.active { background: #4a90e2; color: white; border-color: #4a90e2; }
.field-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: auto; background: #f5f5f5; }
svg#field { max-width: 100%; max-height: 100%; background: #1a5f1a; border: 2px solid #333; touch-action: none; user-select: none; }
.controls { padding: 10px; border-top: 1px solid #ddd; background: #fff; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.controls button { min-height: 40px; padding: 8px 12px; }
.slider-group { display: flex; gap: 6px; align-items: center; }
input[type="range"] { width: 100px; height: 28px; }
.info-panel { padding: 12px; border-top: 1px solid #ddd; background: #f9f9f9; font-size: 13px; min-height: auto; }
.hidden { display: none !important; }
.section { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>

<div class="container">
  <div class="toolbar">
    <!-- Mode buttons -->
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="offense">Edit Offense</button>
      <button class="mode-btn" data-mode="defense">Edit Defense</button>
      <button class="mode-btn" data-mode="play">Play</button>
    </div>
    <div class="divider"></div>

    <!-- Offense controls -->
    <div class="section" id="offenseSection">
      <button id="offenseQBBtn" class="position-btn" data-position="QB">+ QB</button>
      <button id="offenseWRBtn" class="position-btn" data-position="WR">+ WR</button>
      <button id="offenseRBBtn" class="position-btn" data-position="RB">+ RB</button>
      <button id="offenseTEBtn" class="position-btn" data-position="TE">+ TE</button>
      <button id="offenseClearBtn">Clear All</button>
      <button id="offenseClearRoutesBtn">Clear Routes</button>
      <button id="exportOffenseBtn">Save</button>
      <button id="importOffenseBtn">Load</button>
    </div>

    <!-- Defense controls -->
    <div class="section hidden" id="defenseSection">
      <button id="defenseDEBtn" class="position-btn" data-position="DE">+ DE</button>
      <button id="defenseDTBtn" class="position-btn" data-position="DT">+ DT</button>
      <button id="defenseLBBtn" class="position-btn" data-position="LB">+ LB</button>
      <button id="defenseCBBtn" class="position-btn" data-position="CB">+ CB</button>
      <button id="defenseSBtn" class="position-btn" data-position="S">+ S</button>
      <button id="defenseClearBtn">Clear All</button>
      <button id="defenseClearRoutesBtn">Clear Routes</button>
      <button id="exportDefenseBtn">Save</button>
      <button id="importDefenseBtn">Load</button>
    </div>

    <!-- Play controls -->
    <div class="section hidden" id="playSection">
      <button id="playBtn">Play</button>
      <div class="slider-group">
        <label for="speed">Speed:</label>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        <span id="speedValue">1.0x</span>
      </div>
    </div>
  </div>

  <div class="field-container">
    <svg id="field" width="600" height="360" viewBox="0 0 600 360">
      <rect width="600" height="360" fill="#1a5f1a"/>
      <rect x="0" y="0" width="60" height="360" fill="#0d3a0d" opacity="0.7"/>
      <rect x="540" y="0" width="60" height="360" fill="#0d3a0d" opacity="0.7"/>
      <line x1="60" y1="0" x2="60" y2="360" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="120" y1="0" x2="120" y2="360" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="180" y1="0" x2="180" y2="360" stroke="white" stroke-width="1"/>
      <line x1="240" y1="0" x2="240" y2="360" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="300" y1="0" x2="300" y2="360" stroke="white" stroke-width="1"/>
      <line x1="360" y1="0" x2="360" y2="360" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="420" y1="0" x2="420" y2="360" stroke="white" stroke-width="1"/>
      <line x1="480" y1="0" x2="480" y2="360" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="540" y1="0" x2="540" y2="360" stroke="white" stroke-width="1"/>
      <line x1="0" y1="121" x2="600" y2="121" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="239" x2="600" y2="239" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="60" y1="0" x2="60" y2="360" stroke="white" stroke-width="2"/>
      <line x1="540" y1="0" x2="540" y2="360" stroke="white" stroke-width="2"/>
      <g id="routes"></g>
      <g id="players"></g>
    </svg>
  </div>

  <div class="info-panel" id="info">
    <strong>Offense:</strong> Click a position button, then click on the field to place players. Drag to reposition, click to draw routes.
  </div>
</div>

<script>
const svg = document.getElementById('field');
const playersGroup = document.getElementById('players');
const routesGroup = document.getElementById('routes');
const infoDiv = document.getElementById('info');

let offensePlayers = [];
let defenseAllayers = [];
let offenseRoutes = [];
let defenseRoutes = [];
let currentMode = 'offense';
let isSimulating = false;
let selectedPlayer = null;
let drawingRoute = null;
let placementMode = null; // 'QB', 'WR', etc., or null

function createPlayer(x, y, role, isDefense) {
  const player = { id: Math.random(), x, y, role, isDefense, startX: x, startY: y, vx: 0, vy: 0 };
  if (isDefense) {
    defenseAllayers.push(player);
  } else {
    offensePlayers.push(player);
  }
  return player;
}

function initializeEmptySetFormation() {
  offensePlayers = [];
  defenseAllayers = [];

  // Offense empty set - closer to midfield (x around 250-280)
  createPlayer(250, 180, 'QB', false);
  createPlayer(280, 120, 'WR', false);
  createPlayer(280, 145, 'WR', false);
  createPlayer(280, 170, 'WR', false);
  createPlayer(280, 195, 'WR', false);
  createPlayer(280, 220, 'WR', false);

  // Defense formation - closer to midfield, mirrored (x around 320-350)
  createPlayer(320, 160, 'DE', true);
  createPlayer(320, 200, 'DE', true);
  createPlayer(335, 180, 'DT', true);
  createPlayer(350, 120, 'CB', true);
  createPlayer(350, 240, 'CB', true);
  createPlayer(350, 180, 'S', true);

  renderPlayers();
  renderRoutes();
}

function renderRoutes() {
  routesGroup.innerHTML = '';
  const routes = currentMode === 'play' ? [...offenseRoutes, ...defenseRoutes] :
                 (currentMode === 'offense' ? offenseRoutes : defenseRoutes);

  routes.forEach(route => {
    const isDefense = route.isDefense;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', route.x1);
    line.setAttribute('y1', route.y1);
    line.setAttribute('x2', route.x2);
    line.setAttribute('y2', route.y2);
    line.setAttribute('stroke', isDefense ? '#ff5555' : '#5a9fff');
    line.setAttribute('stroke-width', 3);
    line.setAttribute('stroke-dasharray', '5,5');
    routesGroup.appendChild(line);

    const endpoint = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    endpoint.setAttribute('cx', route.x2);
    endpoint.setAttribute('cy', route.y2);
    endpoint.setAttribute('r', 6);
    endpoint.setAttribute('fill', 'none');
    endpoint.setAttribute('stroke', isDefense ? '#ff5555' : '#5a9fff');
    endpoint.setAttribute('stroke-width', 2);
    routesGroup.appendChild(endpoint);
  });

  if (drawingRoute) {
    const previewLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    previewLine.setAttribute('x1', drawingRoute.x1);
    previewLine.setAttribute('y1', drawingRoute.y1);
    previewLine.setAttribute('x2', drawingRoute.x2);
    previewLine.setAttribute('y2', drawingRoute.y2);
    previewLine.setAttribute('stroke', drawingRoute.isDefense ? '#ff9999' : '#9abfff');
    previewLine.setAttribute('stroke-width', 4);
    previewLine.setAttribute('stroke-dasharray', '5,5');
    previewLine.setAttribute('opacity', '0.7');
    routesGroup.appendChild(previewLine);
  }
}

function renderPlayers() {
  playersGroup.innerHTML = '';
  const players = [...offensePlayers, ...defenseAllayers];
  const editingTeam = currentMode === 'defense' ? 'defense' : 'offense';

  players.forEach(p => {
    const isBeingRouted = drawingRoute && drawingRoute.playerId === p.id;
    const isDefense = p.isDefense;
    const isEditable = (editingTeam === 'offense' && !isDefense) || (editingTeam === 'defense' && isDefense) || currentMode === 'play';

    if (isBeingRouted) {
      const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      glow.setAttribute('cx', p.x);
      glow.setAttribute('cy', p.y);
      glow.setAttribute('r', 20);
      glow.setAttribute('fill', 'none');
      glow.setAttribute('stroke', isDefense ? '#ff5555' : '#5a9fff');
      glow.setAttribute('stroke-width', 2);
      glow.setAttribute('opacity', '0.6');
      glow.setAttribute('stroke-dasharray', '3,3');
      playersGroup.appendChild(glow);
    }

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', p.x);
    circle.setAttribute('cy', p.y);
    circle.setAttribute('r', 12);
    circle.setAttribute('fill', isDefense ? '#ff6b6b' : '#4a90e2');
    circle.setAttribute('stroke', isBeingRouted ? '#ffff00' : 'white');
    circle.setAttribute('stroke-width', isBeingRouted ? 3 : 1);
    circle.style.cursor = isEditable ? 'grab' : 'default';
    circle.style.opacity = !isEditable && currentMode !== 'play' ? '0.5' : '1';

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', p.x);
    text.setAttribute('y', p.y);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dy', '0.3em');
    text.setAttribute('font-size', '10');
    text.setAttribute('font-weight', 'bold');
    text.setAttribute('fill', 'white');
    text.setAttribute('pointer-events', 'none');
    text.textContent = p.role[0];

    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.appendChild(circle);
    group.appendChild(text);
    group.dataset.playerId = p.id;

    if (isEditable) {
      group.addEventListener('mousedown', (e) => handleDragStart(e, p.id));
      group.addEventListener('touchstart', (e) => handleDragStart(e, p.id));
    }

    playersGroup.appendChild(group);
  });

  // Update cursor based on placement mode
  if (placementMode) {
    svg.style.cursor = 'crosshair';
  } else {
    svg.style.cursor = 'default';
  }
}

function handleDragStart(e, playerId) {
  e.preventDefault();
  const players = [...offensePlayers, ...defenseAllayers];
  selectedPlayer = players.find(p => p.id === playerId);
  if (!selectedPlayer) return;

  const rect = svg.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const startX = touch.clientX;
  const startY = touch.clientY;
  let hasMoved = false;

  const scaleX = 600 / rect.width;
  const scaleY = 360 / rect.height;

  const offsetX = (startX - rect.left) * scaleX - selectedPlayer.x;
  const offsetY = (startY - rect.top) * scaleY - selectedPlayer.y;

  function handleMove(e) {
    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    const clientX = touch.clientX;
    const clientY = touch.clientY;

    if (Math.abs(clientX - startX) > 5 || Math.abs(clientY - startY) > 5) {
      hasMoved = true;
    }

    if (hasMoved) {
      const x = (clientX - rect.left) * scaleX - offsetX;
      const y = (clientY - rect.top) * scaleY - offsetY;
      selectedPlayer.x = Math.max(0, Math.min(600, x));
      selectedPlayer.y = Math.max(0, Math.min(360, y));
      renderPlayers();
    }
  }

  function handleEnd(e) {
    if (e) e.preventDefault();
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('touchmove', handleMove);
    document.removeEventListener('mouseup', handleEnd);
    document.removeEventListener('touchend', handleEnd);

    if (hasMoved && selectedPlayer) {
      selectedPlayer.startX = selectedPlayer.x;
      selectedPlayer.startY = selectedPlayer.y;
    }

    if (!hasMoved && selectedPlayer) {
      startRouteDrawing({ clientX: startX, clientY: startY }, selectedPlayer.id);
    }

    selectedPlayer = null;
  }

  document.addEventListener('mousemove', handleMove, false);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('mouseup', handleEnd);
  document.addEventListener('touchend', handleEnd);
}

function startRouteDrawing(e, playerId) {
  const players = [...offensePlayers, ...defenseAllayers];
  const player = players.find(p => p.id === playerId);
  if (!player) return;

  const rect = svg.getBoundingClientRect();
  const scaleX = 600 / rect.width;
  const scaleY = 360 / rect.height;

  drawingRoute = { playerId: playerId, x1: player.x, y1: player.y, x2: player.x, y2: player.y, isDefense: player.isDefense };
  renderRoutes();

  function handleMove(e) {
    if (e) e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    const clientX = touch.clientX;
    const clientY = touch.clientY;

    drawingRoute.x2 = (clientX - rect.left) * scaleX;
    drawingRoute.y2 = (clientY - rect.top) * scaleY;
    drawingRoute.x2 = Math.max(0, Math.min(600, drawingRoute.x2));
    drawingRoute.y2 = Math.max(0, Math.min(360, drawingRoute.y2));
    renderRoutes();
  }

  function handleEnd(e) {
    if (e) e.preventDefault();
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('touchmove', handleMove);
    document.removeEventListener('mouseup', handleEnd);
    document.removeEventListener('touchend', handleEnd);

    const routes = currentMode === 'defense' ? defenseRoutes : offenseRoutes;
    if (drawingRoute && (drawingRoute.x1 !== drawingRoute.x2 || drawingRoute.y1 !== drawingRoute.y2)) {
      routes.push({ ...drawingRoute });
      const player = players.find(p => p.id === drawingRoute.playerId);
      if (player) {
        player.x = player.startX;
        player.y = player.startY;
      }
    }
    drawingRoute = null;
    renderRoutes();
    renderPlayers();
  }

  document.addEventListener('mousemove', handleMove, false);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('mouseup', handleEnd);
  document.addEventListener('touchend', handleEnd);
}

function startPlacementMode(position, isDefense) {
  placementMode = position;
  const sectionId = isDefense ? 'defenseSection' : 'offenseSection';
  const btnId = isDefense ? `defense${position}Btn` : `offense${position}Btn`;
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.style.opacity = '0.5';
    btn.textContent = `+ ${position} (Click to place)`;
  }

  infoDiv.textContent = `Click on the field to place a ${position}. Escape to cancel.`;
}

function cancelPlacementMode() {
  if (!placementMode) return;

  const sectionId = currentMode === 'defense' ? 'defenseSection' : 'offenseSection';
  const btnId = (currentMode === 'defense' ? 'defense' : 'offense') + placementMode + 'Btn';
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.style.opacity = '1';
    btn.textContent = `+ ${placementMode}`;
  }

  placementMode = null;
  renderPlayers();

  const editingTeam = currentMode === 'defense' ? 'Defense' : 'Offense';
  infoDiv.textContent = `<strong>${editingTeam}:</strong> Click a position button, then click on the field to place players.`;
}

function simulatePlay() {
  if (isSimulating) return;
  if (offensePlayers.length === 0) {
    infoDiv.textContent = 'No offensive players! Design offense first.';
    return;
  }

  isSimulating = true;
  const modeButtons = document.querySelectorAll('.mode-btn');
  modeButtons.forEach(b => b.disabled = true);

  const speed = parseFloat(document.getElementById('speed').value);
  const duration = 3000 / speed;
  const startTime = Date.now();

  // Setup initial velocity
  offensePlayers.forEach(p => {
    const playerRoute = offenseRoutes.find(r => r.playerId === p.id);
    if (playerRoute) {
      const dx = playerRoute.x2 - p.startX;
      const dy = playerRoute.y2 - p.startY;
      p.vx = dx;
      p.vy = dy;
    } else {
      p.vx = (Math.random() - 0.5) * 400;
      p.vy = -80 - Math.random() * 60;
    }
  });

  defenseAllayers.forEach(def => {
    const defenderRoute = defenseRoutes.find(r => r.playerId === def.id);
    if (defenderRoute) {
      const dx = defenderRoute.x2 - def.startX;
      const dy = defenderRoute.y2 - def.startY;
      def.vx = dx;
      def.vy = dy;
    } else {
      let closestOffense = null;
      let closestDist = Infinity;
      offensePlayers.forEach(off => {
        const dist = Math.hypot(off.startX - def.startX, off.startY - def.startY);
        if (dist < closestDist) {
          closestDist = dist;
          closestOffense = off;
        }
      });
      if (closestOffense) {
        const dx = closestOffense.startX - def.startX;
        const dy = closestOffense.startY - def.startY;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const scale = 150;
          def.vx = (dx / dist) * scale;
          def.vy = (dy / dist) * scale;
        }
      }
    }
  });

  function animate() {
    if (!isSimulating) return;

    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);

    offensePlayers.forEach(p => {
      p.x = p.startX + p.vx * progress;
      p.y = p.startY + p.vy * progress;
      p.x = Math.max(60, Math.min(540, p.x));
      p.y = Math.max(0, Math.min(360, p.y));
    });

    defenseAllayers.forEach(p => {
      p.x = p.startX + p.vx * progress;
      p.y = p.startY + p.vy * progress;
      p.x = Math.max(60, Math.min(540, p.x));
      p.y = Math.max(0, Math.min(360, p.y));
    });

    renderPlayers();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isSimulating = false;
      infoDiv.textContent = 'Play complete!';
      modeButtons.forEach(b => b.disabled = false);
      resetPositions();
    }
  }

  animate();
}

function resetPositions() {
  offensePlayers.forEach(p => { p.x = p.startX; p.y = p.startY; });
  defenseAllayers.forEach(p => { p.x = p.startX; p.y = p.startY; });
  renderPlayers();
}

function switchMode(newMode) {
  cancelPlacementMode();
  currentMode = newMode;

  // Update mode buttons
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-mode="${newMode}"]`).classList.add('active');

  // Update sections
  document.getElementById('offenseSection').classList.toggle('hidden', newMode !== 'offense');
  document.getElementById('defenseSection').classList.toggle('hidden', newMode !== 'defense');
  document.getElementById('playSection').classList.toggle('hidden', newMode !== 'play');

  // Update info
  if (newMode === 'offense') {
    infoDiv.innerHTML = '<strong>Offense:</strong> Click a position button, then click on the field to place players. Drag to reposition, click to draw routes.';
  } else if (newMode === 'defense') {
    infoDiv.innerHTML = '<strong>Defense:</strong> Click a position button, then click on the field to place players. Drag to reposition, click to draw routes.';
  } else {
    infoDiv.innerHTML = '<strong>Play:</strong> Watch your offense vs defense. Adjust speed and hit Play.';
  }

  renderPlayers();
  renderRoutes();
}

// Mode buttons
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => switchMode(btn.dataset.mode));
});

// Position buttons - Offense
['QB', 'WR', 'RB', 'TE'].forEach(position => {
  document.getElementById(`offense${position}Btn`).addEventListener('click', () => {
    if (placementMode === position) {
      cancelPlacementMode();
    } else {
      cancelPlacementMode();
      startPlacementMode(position, false);
    }
  });
});

// Position buttons - Defense
['DE', 'DT', 'LB', 'CB', 'S'].forEach(position => {
  document.getElementById(`defense${position}Btn`).addEventListener('click', () => {
    if (placementMode === position) {
      cancelPlacementMode();
    } else {
      cancelPlacementMode();
      startPlacementMode(position, true);
    }
  });
});

// Clear all players
document.getElementById('offenseClearBtn').addEventListener('click', () => {
  offensePlayers = [];
  offenseRoutes = [];
  renderPlayers();
  renderRoutes();
});

document.getElementById('defenseClearBtn').addEventListener('click', () => {
  defenseAllayers = [];
  defenseRoutes = [];
  renderPlayers();
  renderRoutes();
});

// Clear routes
document.getElementById('offenseClearRoutesBtn').addEventListener('click', () => {
  offenseRoutes = [];
  renderRoutes();
});

document.getElementById('defenseClearRoutesBtn').addEventListener('click', () => {
  defenseRoutes = [];
  renderRoutes();
});

// Field click handler for placement mode
svg.addEventListener('click', (e) => {
  if (!placementMode) return;

  const rect = svg.getBoundingClientRect();
  const scaleX = 600 / rect.width;
  const scaleY = 360 / rect.height;

  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  const isDefense = currentMode === 'defense';
  createPlayer(x, y, placementMode, isDefense);
  renderPlayers();
  cancelPlacementMode();
});

// Escape key to cancel placement mode
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && placementMode) {
    cancelPlacementMode();
  }
});

// Play controls
document.getElementById('playBtn').addEventListener('click', simulatePlay);
document.getElementById('speed').addEventListener('input', (e) => {
  document.getElementById('speedValue').textContent = e.target.value + 'x';
});

// Export/Import
['offense', 'defense'].forEach(side => {
  document.getElementById(`export${side.charAt(0).toUpperCase() + side.slice(1)}Btn`).addEventListener('click', () => {
    const players = side === 'offense' ? offensePlayers : defenseAllayers;
    const routes = side === 'offense' ? offenseRoutes : defenseRoutes;
    navigator.clipboard.writeText(JSON.stringify({
      players: players.map(p => ({ x: p.x, y: p.y, role: p.role })),
      routes: routes
    }));
    infoDiv.textContent = `${side} saved!`;
  });

  document.getElementById(`import${side.charAt(0).toUpperCase() + side.slice(1)}Btn`).addEventListener('click', () => {
    navigator.clipboard.readText().then(text => {
      try {
        const data = JSON.parse(text);
        if (side === 'offense') {
          offensePlayers = [];
          data.players.forEach(p => createPlayer(p.x, p.y, p.role, false));
          offenseRoutes = data.routes || [];
        } else {
          defenseAllayers = [];
          data.players.forEach(p => createPlayer(p.x, p.y, p.role, true));
          defenseRoutes = data.routes || [];
        }
        renderPlayers();
        renderRoutes();
        infoDiv.textContent = `${side} loaded!`;
      } catch {
        infoDiv.textContent = 'Load failed';
      }
    });
  });
});

// Initialize with empty set formations
initializeEmptySetFormation();
switchMode('offense');
</script>
