<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Play Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Space Grotesk', system-ui, sans-serif; background: #0f0f0f; width: 100%; height: 100%; }
.container { display: flex; flex-direction: column; height: 100vh; width: 100%; background: #0f0f0f; }
.toolbar { padding: 16px; border-bottom: 2px solid #374151; display: flex; gap: 12px; flex-wrap: wrap; background: #1f2937; font-size: 14px; align-items: center; }
.toolbar button, .toolbar select { padding: 10px 14px; border: 1px solid #4b5563; background: transparent; color: #9ca3af; border-radius: 6px; cursor: pointer; font-size: 13px; min-height: 44px; touch-action: manipulation; font-family: inherit; font-weight: 600; }
.toolbar button:hover { background: #374151; }
.toolbar button.active { background: #3b82f6; color: white; border-color: #3b82f6; }
.mode-buttons { display: flex; gap: 4px; border-right: 1px solid #4b5563; padding-right: 12px; }
.divider { width: 1px; background: #4b5563; height: 30px; }
@media (max-width: 600px) {
  .toolbar { padding: 12px; gap: 8px; }
  .toolbar button, .toolbar select { padding: 10px 12px; font-size: 12px; min-height: 40px; }
  .mode-buttons { gap: 2px; }
}
.field-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; background: linear-gradient(180deg, #0d4620 0%, #0a3a1a 100%); }
svg#field { max-width: 100%; max-height: 100%; background: linear-gradient(90deg, #0d4620 0%, #0a3a1a 100%); border: 3px solid #fbbf24; touch-action: none; user-select: none; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.controls { padding: 10px; border-top: 1px solid #ddd; background: #fff; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.controls button { min-height: 40px; padding: 8px 12px; }
.slider-group { display: flex; gap: 6px; align-items: center; }
input[type="range"] { width: 100px; height: 28px; }
.info-panel { padding: 14px 16px; border-top: 1px solid #374151; background: #1f2937; font-size: 13px; color: #d1d5db; line-height: 1.5; min-height: auto; }
.info-panel strong { color: #fbbf24; }
.hidden { display: none !important; }
.section { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>

<div class="container">
  <div class="toolbar">
    <!-- Mode buttons -->
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="offense">Edit Offense</button>
      <button class="mode-btn" data-mode="defense">Edit Defense</button>
      <button class="mode-btn" data-mode="play">Play</button>
    </div>
    <div class="divider"></div>

    <!-- Offense controls -->
    <div class="section" id="offenseSection">
      <button id="offenseQBBtn" class="position-btn" data-position="QB">+ QB</button>
      <button id="offenseWRBtn" class="position-btn" data-position="WR">+ WR</button>
      <button id="offenseRBBtn" class="position-btn" data-position="RB">+ RB</button>
      <button id="offenseTEBtn" class="position-btn" data-position="TE">+ TE</button>
      <button id="offenseClearBtn">Clear All</button>
      <button id="offenseClearRoutesBtn">Clear Routes</button>
      <button id="exportOffenseBtn">Save</button>
      <button id="importOffenseBtn">Load</button>
    </div>

    <!-- Defense controls -->
    <div class="section hidden" id="defenseSection">
      <button id="defenseDEBtn" class="position-btn" data-position="DE">+ DE</button>
      <button id="defenseDTBtn" class="position-btn" data-position="DT">+ DT</button>
      <button id="defenseLBBtn" class="position-btn" data-position="LB">+ LB</button>
      <button id="defenseCBBtn" class="position-btn" data-position="CB">+ CB</button>
      <button id="defenseSBtn" class="position-btn" data-position="S">+ S</button>
      <button id="defenseClearBtn">Clear All</button>
      <button id="defenseClearRoutesBtn">Clear Routes</button>
      <button id="exportDefenseBtn">Save</button>
      <button id="importDefenseBtn">Load</button>
    </div>

    <!-- Play controls -->
    <div class="section hidden" id="playSection">
      <button id="playBtn">Play</button>
      <div class="slider-group">
        <label for="speed">Speed:</label>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        <span id="speedValue">1.0x</span>
      </div>
    </div>

    <!-- Route drawing controls -->
    <div class="section" id="routeSection">
      <button id="drawRoutesBtn" class="mode-btn">🎯 Draw Routes</button>
      <button id="clearRoutesBtn">Clear Routes</button>
    </div>
  </div>

  <div class="field-container">
    <svg id="field" width="550" height="600" viewBox="0 0 550 600">
      <defs>
        <linearGradient id="fieldGradient" x1="0" y1="0" x2="0" y2="600">
          <stop offset="0%" style="stop-color:#0d4620;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0a3a1a;stop-opacity:1" />
        </linearGradient>
      </defs>
      <rect width="550" height="600" fill="url(#fieldGradient)"/>
      <rect x="0" y="0" width="550" height="60" fill="#0d3a0d" opacity="0.7"/>
      <rect x="0" y="540" width="550" height="60" fill="#0d3a0d" opacity="0.7"/>
      <line x1="0" y1="60" x2="550" y2="60" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="0" y1="120" x2="550" y2="120" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="0" y1="180" x2="550" y2="180" stroke="white" stroke-width="1"/>
      <line x1="0" y1="240" x2="550" y2="240" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="0" y1="300" x2="550" y2="300" stroke="white" stroke-width="1"/>
      <line x1="0" y1="360" x2="550" y2="360" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="0" y1="420" x2="550" y2="420" stroke="white" stroke-width="1"/>
      <line x1="0" y1="480" x2="550" y2="480" stroke="white" stroke-width="1" stroke-dasharray="2,8"/>
      <line x1="0" y1="540" x2="550" y2="540" stroke="white" stroke-width="1"/>
      <line x1="151" y1="0" x2="151" y2="600" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="299" y1="0" x2="299" y2="600" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="60" x2="550" y2="60" stroke="white" stroke-width="2"/>
      <line x1="0" y1="540" x2="550" y2="540" stroke="white" stroke-width="2"/>
      <g id="routes"></g>
      <g id="players"></g>
    </svg>
  </div>

  <div class="info-panel" id="info">
    <strong>Offense:</strong> Click a position button, then click on the field to place players. Tap a player to move or draw routes.
  </div>

</div>

<script>
const svg = document.getElementById('field');
const playersGroup = document.getElementById('players');
const routesGroup = document.getElementById('routes');
const infoDiv = document.getElementById('info');

let offensePlayers = [];
let defenseAllayers = [];
let offenseRoutes = [];
let defenseRoutes = [];
let currentMode = 'offense';
let isSimulating = false;
let drawRoutesMode = false;
let routeStartPlayerId = null;
let placementMode = null;

function createPlayer(x, y, role, isDefense) {
  const player = { id: Math.random(), x, y, role, isDefense, startX: x, startY: y, vx: 0, vy: 0 };
  if (isDefense) {
    defenseAllayers.push(player);
  } else {
    offensePlayers.push(player);
  }
  return player;
}

function initializeEmptySetFormation() {
  offensePlayers = [];
  defenseAllayers = [];

  // Offense formation - 11 players (5 OL, 4 WR, 1 QB, 1 RB) - BELOW SCRIMMAGE LINE
  createPlayer(275, 480, 'QB', false);
  createPlayer(250, 450, 'RB', false);
  // Offensive Line - at scrimmage line
  createPlayer(125, 320, 'LT', false);
  createPlayer(175, 320, 'LG', false);
  createPlayer(275, 320, 'C', false);
  createPlayer(375, 320, 'RG', false);
  createPlayer(425, 320, 'RT', false);
  // Wide Receivers - spread to edges, downfield
  createPlayer(80, 400, 'WR', false);
  createPlayer(155, 400, 'WR', false);
  createPlayer(395, 400, 'WR', false);
  createPlayer(470, 400, 'WR', false);

  // Defense formation - 11 players (4-3 Defense: 2 DE, 2 DT, 3 LB, 2 CB, 2 S) - ABOVE SCRIMMAGE LINE
  // Defensive Ends
  createPlayer(120, 140, 'DE', true);
  createPlayer(430, 140, 'DE', true);
  // Defensive Tackles
  createPlayer(190, 200, 'DT', true);
  createPlayer(360, 200, 'DT', true);
  // Linebackers - at/near scrimmage line
  createPlayer(120, 270, 'LB', true);
  createPlayer(275, 270, 'LB', true);
  createPlayer(430, 270, 'LB', true);
  // Cornerbacks - at edges, covering WRs
  createPlayer(60, 160, 'CB', true);
  createPlayer(490, 160, 'CB', true);
  // Safeties - deep coverage
  createPlayer(200, 100, 'S', true);
  createPlayer(350, 100, 'S', true);

  renderPlayers();
  renderRoutes();
}

function renderRoutes() {
  routesGroup.innerHTML = '';
  const routes = currentMode === 'play' ? [...offenseRoutes, ...defenseRoutes] :
                 (currentMode === 'offense' ? offenseRoutes : defenseRoutes);

  routes.forEach(route => {
    const isDefense = route.isDefense;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', route.x1);
    line.setAttribute('y1', route.y1);
    line.setAttribute('x2', route.x2);
    line.setAttribute('y2', route.y2);
    line.setAttribute('stroke', isDefense ? '#ff5555' : '#5a9fff');
    line.setAttribute('stroke-width', 3);
    line.setAttribute('stroke-dasharray', '5,5');
    routesGroup.appendChild(line);

    const endpoint = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    endpoint.setAttribute('cx', route.x2);
    endpoint.setAttribute('cy', route.y2);
    endpoint.setAttribute('r', 6);
    endpoint.setAttribute('fill', 'none');
    endpoint.setAttribute('stroke', isDefense ? '#ff5555' : '#5a9fff');
    endpoint.setAttribute('stroke-width', 2);
    routesGroup.appendChild(endpoint);
  });
}

function renderPlayers() {
  playersGroup.innerHTML = '';
  const players = [...offensePlayers, ...defenseAllayers];
  const editingTeam = currentMode === 'defense' ? 'defense' : 'offense';

  players.forEach(p => {
    const isBeingRouted = routeStartPlayerId === p.id;
    const isDefense = p.isDefense;
    const isEditable = (editingTeam === 'offense' && !isDefense) || (editingTeam === 'defense' && isDefense) || currentMode === 'play';

    const primaryColor = isDefense ? '#ef4444' : '#3b82f6';
    const accentColor = isDefense ? '#dc2626' : '#1d4ed8';
    const opacity = !isEditable && currentMode !== 'play' ? '0.7' : '1';

    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('opacity', opacity);
    group.setAttribute('transform', `translate(${p.x}, ${p.y})`);

    // Highlight player being routed in Draw Routes mode
    if (isBeingRouted) {
      // Outer glow
      const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      glow.setAttribute('cx', 0);
      glow.setAttribute('cy', 0);
      glow.setAttribute('r', 36);
      glow.setAttribute('fill', 'none');
      glow.setAttribute('stroke', '#fbbf24');
      glow.setAttribute('stroke-width', 2);
      glow.setAttribute('opacity', '0.4');
      group.appendChild(glow);

      // Inner highlight
      const highlight = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      highlight.setAttribute('cx', 0);
      highlight.setAttribute('cy', 0);
      highlight.setAttribute('r', 28);
      highlight.setAttribute('fill', '#fbbf24');
      highlight.setAttribute('fill-opacity', '0.15');
      highlight.setAttribute('stroke', '#fbbf24');
      highlight.setAttribute('stroke-width', 2.5);
      highlight.setAttribute('opacity', '1');
      group.appendChild(highlight);
    }

    // Helmet
    const helmet = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    helmet.setAttribute('cx', 0);
    helmet.setAttribute('cy', -14);
    helmet.setAttribute('r', 6);
    helmet.setAttribute('fill', accentColor);
    helmet.setAttribute('stroke', 'white');
    helmet.setAttribute('stroke-width', '1');
    group.appendChild(helmet);

    // Jersey graphic - realistic football jersey
    const jerseyGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    jerseyGroup.setAttribute('transform', 'scale(0.5)');

    // Main jersey body (trapezoid shape for realistic look)
    const jerseyBody = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    jerseyBody.setAttribute('d', 'M -14 -8 L 14 -8 L 16 20 L -16 20 Z');
    jerseyBody.setAttribute('fill', primaryColor);
    jerseyBody.setAttribute('stroke', 'white');
    jerseyBody.setAttribute('stroke-width', '2');
    jerseyBody.style.cursor = isEditable ? 'grab' : 'default';
    jerseyGroup.appendChild(jerseyBody);

    // Left shoulder/sleeve
    const leftShoulder = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    leftShoulder.setAttribute('d', 'M -14 -6 L -24 0 L -22 12 L -14 8 Z');
    leftShoulder.setAttribute('fill', primaryColor);
    leftShoulder.setAttribute('stroke', 'white');
    leftShoulder.setAttribute('stroke-width', '1.5');
    jerseyGroup.appendChild(leftShoulder);

    // Right shoulder/sleeve
    const rightShoulder = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    rightShoulder.setAttribute('d', 'M 14 -6 L 24 0 L 22 12 L 14 8 Z');
    rightShoulder.setAttribute('fill', primaryColor);
    rightShoulder.setAttribute('stroke', 'white');
    rightShoulder.setAttribute('stroke-width', '1.5');
    jerseyGroup.appendChild(rightShoulder);

    // Collar outline
    const collar = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    collar.setAttribute('d', 'M -6 -8 L 6 -8 L 5 -2 L -5 -2 Z');
    collar.setAttribute('fill', 'none');
    collar.setAttribute('stroke', accentColor);
    collar.setAttribute('stroke-width', '1.5');
    jerseyGroup.appendChild(collar);

    // Center stripe (vertical accent line)
    const stripe = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    stripe.setAttribute('x1', 0);
    stripe.setAttribute('y1', -8);
    stripe.setAttribute('x2', 0);
    stripe.setAttribute('y2', 20);
    stripe.setAttribute('stroke', 'white');
    stripe.setAttribute('stroke-width', '1');
    stripe.setAttribute('opacity', '0.4');
    jerseyGroup.appendChild(stripe);

    group.appendChild(jerseyGroup);

    // Jersey number - large and bold
    const numberText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    numberText.setAttribute('x', 0);
    numberText.setAttribute('y', 6);
    numberText.setAttribute('text-anchor', 'middle');
    numberText.setAttribute('font-size', '12');
    numberText.setAttribute('font-weight', 'bold');
    numberText.setAttribute('font-family', 'Arial, sans-serif');
    numberText.setAttribute('fill', 'white');
    numberText.setAttribute('pointer-events', 'none');
    numberText.textContent = p.role[0];
    group.appendChild(numberText);

    group.dataset.playerId = p.id;

    if (isEditable) {
      group.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        // If in Draw Routes mode, start route from this player
        if (drawRoutesMode) {
          routeStartPlayerId = p.id;
          renderPlayers();
          infoDiv.textContent = `Drawing route from ${p.role}. Click the field to set endpoint.`;
        } else {
          // Otherwise drag to move
          handlePlayerInteraction(e, p.id);
        }
      });
      group.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        // If in Draw Routes mode, start route from this player
        if (drawRoutesMode) {
          routeStartPlayerId = p.id;
          renderPlayers();
          infoDiv.textContent = `Drawing route from ${p.role}. Click the field to set endpoint.`;
        } else {
          // Otherwise drag to move
          handlePlayerInteraction(e, p.id);
        }
      });
      group.style.cursor = drawRoutesMode ? 'crosshair' : 'grab';
    }

    playersGroup.appendChild(group);
  });

  if (placementMode) {
    svg.style.cursor = 'crosshair';
  } else {
    svg.style.cursor = 'default';
  }
}

function handlePlayerInteraction(e, playerId) {
  const players = [...offensePlayers, ...defenseAllayers];
  const player = players.find(p => p.id === playerId);
  if (!player) return;

  const rect = svg.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const startX = touch.clientX;
  const startY = touch.clientY;
  let hasMoved = false;

  const scaleX = 550 / rect.width;
  const scaleY = 600 / rect.height;

  const offsetX = (startX - rect.left) * scaleX - player.x;
  const offsetY = (startY - rect.top) * scaleY - player.y;

  function handleMove(e) {
    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    const clientX = touch.clientX;
    const clientY = touch.clientY;

    if (Math.abs(clientX - startX) > 5 || Math.abs(clientY - startY) > 5) {
      hasMoved = true;
    }

    if (hasMoved) {
      const x = (clientX - rect.left) * scaleX - offsetX;
      const y = (clientY - rect.top) * scaleY - offsetY;
      player.x = Math.max(0, Math.min(550, x));
      player.y = Math.max(0, Math.min(600, y));
      renderPlayers();
    }
  }

  function handleEnd(e) {
    if (e) e.preventDefault();
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('touchmove', handleMove);
    document.removeEventListener('mouseup', handleEnd);
    document.removeEventListener('touchend', handleEnd);

    if (hasMoved) {
      player.startX = player.x;
      player.startY = player.y;
    }
  }

  document.addEventListener('mousemove', handleMove, false);
  document.addEventListener('touchmove', handleMove, { passive: false });
  document.addEventListener('mouseup', handleEnd);
  document.addEventListener('touchend', handleEnd);
}



function startPlacementMode(position, isDefense) {
  placementMode = position;
  const sectionId = isDefense ? 'defenseSection' : 'offenseSection';
  const btnId = isDefense ? `defense${position}Btn` : `offense${position}Btn`;
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.style.opacity = '0.5';
    btn.textContent = `+ ${position} (Click to place)`;
  }

  infoDiv.textContent = `Click on the field to place a ${position}. Escape to cancel.`;
}

function cancelPlacementMode() {
  if (!placementMode) return;

  const sectionId = currentMode === 'defense' ? 'defenseSection' : 'offenseSection';
  const btnId = (currentMode === 'defense' ? 'defense' : 'offense') + placementMode + 'Btn';
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.style.opacity = '1';
    btn.textContent = `+ ${placementMode}`;
  }

  placementMode = null;
  renderPlayers();

  const editingTeam = currentMode === 'defense' ? 'Defense' : 'Offense';
  infoDiv.textContent = `<strong>${editingTeam}:</strong> Click a position button, then click on the field to place players.`;
}

function simulatePlay() {
  if (isSimulating) return;
  if (offensePlayers.length === 0) {
    infoDiv.textContent = 'No offensive players! Design offense first.';
    return;
  }

  isSimulating = true;
  const modeButtons = document.querySelectorAll('.mode-btn');
  modeButtons.forEach(b => b.disabled = true);

  const speed = parseFloat(document.getElementById('speed').value);
  const duration = 3000 / speed;
  const startTime = Date.now();

  // Setup initial velocity
  offensePlayers.forEach(p => {
    const playerRoute = offenseRoutes.find(r => r.playerId === p.id);
    if (playerRoute) {
      const dx = playerRoute.x2 - p.startX;
      const dy = playerRoute.y2 - p.startY;
      p.vx = dx;
      p.vy = dy;
    } else {
      p.vx = (Math.random() - 0.5) * 400;
      p.vy = -80 - Math.random() * 60;
    }
  });

  defenseAllayers.forEach(def => {
    const defenderRoute = defenseRoutes.find(r => r.playerId === def.id);
    if (defenderRoute) {
      const dx = defenderRoute.x2 - def.startX;
      const dy = defenderRoute.y2 - def.startY;
      def.vx = dx;
      def.vy = dy;
    } else {
      let closestOffense = null;
      let closestDist = Infinity;
      offensePlayers.forEach(off => {
        const dist = Math.hypot(off.startX - def.startX, off.startY - def.startY);
        if (dist < closestDist) {
          closestDist = dist;
          closestOffense = off;
        }
      });
      if (closestOffense) {
        const dx = closestOffense.startX - def.startX;
        const dy = closestOffense.startY - def.startY;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const scale = 150;
          def.vx = (dx / dist) * scale;
          def.vy = (dy / dist) * scale;
        }
      }
    }
  });

  function animate() {
    if (!isSimulating) return;

    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);

    offensePlayers.forEach(p => {
      p.x = p.startX + p.vx * progress;
      p.y = p.startY + p.vy * progress;
      p.x = Math.max(0, Math.min(550, p.x));
      p.y = Math.max(60, Math.min(540, p.y));
    });

    defenseAllayers.forEach(p => {
      p.x = p.startX + p.vx * progress;
      p.y = p.startY + p.vy * progress;
      p.x = Math.max(0, Math.min(550, p.x));
      p.y = Math.max(60, Math.min(540, p.y));
    });

    renderPlayers();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isSimulating = false;
      infoDiv.textContent = 'Play complete!';
      modeButtons.forEach(b => b.disabled = false);
      resetPositions();
    }
  }

  animate();
}

function resetPositions() {
  offensePlayers.forEach(p => { p.x = p.startX; p.y = p.startY; });
  defenseAllayers.forEach(p => { p.x = p.startX; p.y = p.startY; });
  renderPlayers();
}

function switchMode(newMode) {
  cancelPlacementMode();
  drawRoutesMode = false;
  routeStartPlayerId = null;
  currentMode = newMode;

  // Update mode buttons
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  const modeBtn = document.querySelector(`[data-mode="${newMode}"]`);
  if (modeBtn) {
    modeBtn.classList.add('active');
  }

  // Update sections
  document.getElementById('offenseSection').classList.toggle('hidden', newMode !== 'offense');
  document.getElementById('defenseSection').classList.toggle('hidden', newMode !== 'defense');
  document.getElementById('playSection').classList.toggle('hidden', newMode !== 'play');

  // Update info
  if (newMode === 'offense') {
    infoDiv.innerHTML = '<strong>Offense:</strong> Click a position button to place players. Drag to move. Use Draw Routes mode to draw routes.';
  } else if (newMode === 'defense') {
    infoDiv.innerHTML = '<strong>Defense:</strong> Click a position button to place players. Drag to move. Use Draw Routes mode to draw routes.';
  } else {
    infoDiv.innerHTML = '<strong>Play:</strong> Watch your offense vs defense. Adjust speed and hit Play.';
  }

  renderPlayers();
  renderRoutes();
}

// Draw Routes mode toggle
document.getElementById('drawRoutesBtn').addEventListener('click', () => {
  drawRoutesMode = !drawRoutesMode;
  routeStartPlayerId = null;
  document.getElementById('drawRoutesBtn').classList.toggle('active', drawRoutesMode);

  if (drawRoutesMode) {
    infoDiv.textContent = 'Draw Routes: Click a player, then click the field to set the route endpoint.';
  } else {
    infoDiv.textContent = 'Draw Routes mode disabled.';
  }
  renderPlayers();
});

// Clear Routes button
document.getElementById('clearRoutesBtn').addEventListener('click', () => {
  if (currentMode === 'offense') {
    offenseRoutes = [];
  } else if (currentMode === 'defense') {
    defenseRoutes = [];
  }
  routeStartPlayerId = null;
  renderRoutes();
});

// Mode buttons (only buttons with data-mode attribute, not Draw Routes)
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => switchMode(btn.dataset.mode));
});

// Position buttons - Offense
['QB', 'WR', 'RB', 'TE'].forEach(position => {
  document.getElementById(`offense${position}Btn`).addEventListener('click', () => {
    if (placementMode === position) {
      cancelPlacementMode();
    } else {
      cancelPlacementMode();
      startPlacementMode(position, false);
    }
  });
});

// Position buttons - Defense
['DE', 'DT', 'LB', 'CB', 'S'].forEach(position => {
  document.getElementById(`defense${position}Btn`).addEventListener('click', () => {
    if (placementMode === position) {
      cancelPlacementMode();
    } else {
      cancelPlacementMode();
      startPlacementMode(position, true);
    }
  });
});

// Clear all players
document.getElementById('offenseClearBtn').addEventListener('click', () => {
  offensePlayers = [];
  offenseRoutes = [];
  renderPlayers();
  renderRoutes();
});

document.getElementById('defenseClearBtn').addEventListener('click', () => {
  defenseAllayers = [];
  defenseRoutes = [];
  renderPlayers();
  renderRoutes();
});

// Clear routes
document.getElementById('offenseClearRoutesBtn').addEventListener('click', () => {
  offenseRoutes = [];
  renderRoutes();
});

document.getElementById('defenseClearRoutesBtn').addEventListener('click', () => {
  defenseRoutes = [];
  renderRoutes();
});

// Field click handler for placement mode and route drawing
svg.addEventListener('click', (e) => {
  // If in placement mode, place a new player
  if (placementMode) {
    const rect = svg.getBoundingClientRect();
    const scaleX = 550 / rect.width;
    const scaleY = 600 / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    const isDefense = currentMode === 'defense';
    createPlayer(x, y, placementMode, isDefense);
    renderPlayers();
    cancelPlacementMode();
  }
  // Handle route drawing in Draw Routes mode
  else if (drawRoutesMode && routeStartPlayerId) {
    const rect = svg.getBoundingClientRect();
    const scaleX = 550 / rect.width;
    const scaleY = 600 / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    const players = [...offensePlayers, ...defenseAllayers];
    const player = players.find(p => p.id === routeStartPlayerId);
    if (player) {
      const routes = currentMode === 'defense' ? defenseRoutes : offenseRoutes;
      routes.push({
        playerId: routeStartPlayerId,
        x1: player.x,
        y1: player.y,
        x2: Math.max(0, Math.min(550, x)),
        y2: Math.max(0, Math.min(600, y)),
        isDefense: player.isDefense
      });
      renderRoutes();
      routeStartPlayerId = null;
      infoDiv.textContent = 'Route drawn! Click a player to draw another route.';
    }
  }
});

// Escape key to cancel placement mode
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && placementMode) {
    cancelPlacementMode();
  }
});

// Play controls
document.getElementById('playBtn').addEventListener('click', simulatePlay);
document.getElementById('speed').addEventListener('input', (e) => {
  document.getElementById('speedValue').textContent = e.target.value + 'x';
});

// Export/Import
['offense', 'defense'].forEach(side => {
  document.getElementById(`export${side.charAt(0).toUpperCase() + side.slice(1)}Btn`).addEventListener('click', () => {
    const players = side === 'offense' ? offensePlayers : defenseAllayers;
    const routes = side === 'offense' ? offenseRoutes : defenseRoutes;
    navigator.clipboard.writeText(JSON.stringify({
      players: players.map(p => ({ x: p.x, y: p.y, role: p.role })),
      routes: routes
    }));
    infoDiv.textContent = `${side} saved!`;
  });

  document.getElementById(`import${side.charAt(0).toUpperCase() + side.slice(1)}Btn`).addEventListener('click', () => {
    navigator.clipboard.readText().then(text => {
      try {
        const data = JSON.parse(text);
        if (side === 'offense') {
          offensePlayers = [];
          data.players.forEach(p => createPlayer(p.x, p.y, p.role, false));
          offenseRoutes = data.routes || [];
        } else {
          defenseAllayers = [];
          data.players.forEach(p => createPlayer(p.x, p.y, p.role, true));
          defenseRoutes = data.routes || [];
        }
        renderPlayers();
        renderRoutes();
        infoDiv.textContent = `${side} loaded!`;
      } catch {
        infoDiv.textContent = 'Load failed';
      }
    });
  });
});

// Initialize with empty set formations
initializeEmptySetFormation();
switchMode('offense');
</script>

</body>
</html>
